[project]
name = "token-hud"
version = "0.1.0"
description = "Neon, Grafana-flavoured desktop widget for Claude Code economics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyQt6>=6.9"]

[project.scripts]
token-hud = "token_hud.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["token_hud"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "pillow>=11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
